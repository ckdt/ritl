<script>
(() => {
  const svg = document.querySelector('.logo');
  const mark = document.getElementById('mark');
  const ball = document.getElementById('eyeball');

  // Where the pupil sits in the Figma design.
  const REST = { x: 124.397, y: 33.1525 };
  // Space the pupil centre may travel inside the socket (mark coordinates).
  // Socket: x 99.1–170.1, y 11.4–55.0; pupil radius 15.7, plus a small margin.
  const C  = { x: 135.35, y: 33.15 };
  const RX = 17.5;
  const RY = 4.2;
  // Distance (mark units) at which the pupil reaches the edge of the socket.
  const REACH = 110;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let target = { ...REST };
  let pos = { ...REST };
  let lastInput = 0;
  let idleTimer = 0;

  function lookAt(clientX, clientY) {
    const ctm = mark.getScreenCTM();
    if (!ctm) return;
    const p = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
    const dx = p.x - C.x;
    const dy = p.y - C.y;
    const d = Math.hypot(dx, dy) || 1;
    const t = Math.min(1, d / REACH);
    target = { x: C.x + (dx / d) * RX * t, y: C.y + (dy / d) * RY * t };
    lastInput = performance.now();
  }

  addEventListener('pointermove', e => lookAt(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', e => lookAt(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { target = { ...REST }; });
  addEventListener('blur', () => { target = { ...REST }; });

  // With no pointer around (phones, idle desktop) the eye glances around now and then.
  function wander(now) {
    if (now - lastInput < 2500) return;
    if (now < idleTimer) return;
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() < 0.35 ? 0 : 0.6 + Math.random() * 0.4;
    target = r === 0 ? { ...REST } : { x: C.x + Math.cos(a) * RX * r, y: C.y + Math.sin(a) * RY * r };
    idleTimer = now + 1200 + Math.random() * 2200;
  }

  // Blinking: the white pupil squashes to a thin line and opens again.
  const R = 15.6925;
  const BLINK_MS = 160;
  let blinkAt = performance.now() + 1500 + Math.random() * 2000;
  let blinkQueue = 0;

  function lidAt(now) {
    const t = now - blinkAt;
    if (t < 0) return 0;
    if (t > BLINK_MS) {
      if (blinkQueue > 0) { blinkQueue--; blinkAt = now + 90; }
      else {
        blinkAt = now + 2500 + Math.random() * 4500;
        blinkQueue = Math.random() < 0.2 ? 1 : 0; // now and then a double blink
      }
      return 0;
    }
    // Close fast, open a little slower.
    const half = BLINK_MS * 0.4;
    return t < half ? t / half : 1 - (t - half) / (BLINK_MS - half);
  }

  function frame(now) {
    if (!reduced) wander(now);
    const lid = reduced ? 0 : lidAt(now);
    ball.setAttribute('ry', (R * (1 - 0.94 * lid)).toFixed(2));
    const k = reduced ? 1 : 0.14;
    pos.x += (target.x - pos.x) * k;
    pos.y += (target.y - pos.y) * k;
    ball.setAttribute('cx', pos.x.toFixed(2));
    ball.setAttribute('cy', pos.y.toFixed(2));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
